name: Report production deployment status

# Coolify deploys on its own via a webhook — this workflow doesn't trigger or
# control that deploy. It just waits for it to roll out, then checks the
# public /api/health endpoint and records a real GitHub Deployment record,
# so the repo's Deployments tab reflects whether the site actually came back
# up healthy, not just that a push happened.

on:
  push:
    branches: [main]

permissions:
  deployments: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < backend/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — version wasn't bumped, nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "${{ github.sha }}"
          fi

  report:
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "Production",
              auto_merge: false,
              required_contexts: [],
            });
            core.setOutput("id", deployment.data.id);

      - name: Wait for Coolify's webhook-triggered rollout
        run: sleep 90

      - name: Poll production health
        id: health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 https://joslazip.com/api/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"

      - name: Mark deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const healthy = "${{ steps.health.outputs.healthy }}" === "true";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: healthy ? "success" : "failure",
              environment_url: "https://joslazip.com",
              description: healthy
                ? "Production is healthy after deploy."
                : "Production did not respond healthy within 3 minutes of push.",
            });
