services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${MASTER_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: joslasync
      ENVIRONMENT: production

      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${MASTER_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432

      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}

      MASTER_USERNAME: ${MASTER_USERNAME}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      MASTER_EMAIL: ${MASTER_USERNAME}
      MASTER_DB_NAME: ${MASTER_DB_NAME}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-JoslaSync}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ORIGINS: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: lax
    volumes:
      - backend_logos:/app/static/logos
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_JOSLASYNC_API_URL: ${PUBLIC_URL}
        VITE_MASTER_EMAIL: ${MASTER_USERNAME}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  postgres_data:
  backend_logos:
